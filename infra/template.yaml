AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  ¿Cuánto me cuesta de verdad? — función Lambda que analiza ofertas de crédito,
  expuesta por una Lambda Function URL pública con CORS.

Globals:
  Function:
    Timeout: 10
    MemorySize: 128
    Runtime: python3.12

Parameters:
  CorsOrigin:
    Type: String
    Default: "*"
    Description: Origen permitido por CORS (la URL del frontend en producción).

Resources:
  AnalizarFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: analizar-oferta
      # El código vive en backend/; app/ es el paquete con la lógica.
      CodeUri: ../backend/
      Handler: app.lambda_handler.handler
      Environment:
        Variables:
          CORS_ORIGIN: !Ref CorsOrigin
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins:
            - !Ref CorsOrigin
          AllowMethods:
            - GET
            - POST
            - OPTIONS
          AllowHeaders:
            - content-type

Outputs:
  FunctionUrl:
    Description: URL pública de la API (usar como VITE_API_URL en el frontend).
    Value: !GetAtt AnalizarFunctionUrl.FunctionUrl
