# Build spec para AWS Amplify Hosting.
#
# La app es 100% estática: todo el cálculo corre en el navegador, no hay
# backend ni variables de entorno obligatorias. El frontend vive en la
# subcarpeta frontend/, por eso se usa la sintaxis de monorepo con appRoot.
version: 1
applications:
  - appRoot: frontend
    frontend:
      phases:
        preBuild:
          commands:
            - npm ci
        build:
          commands:
            - npm run build
      artifacts:
        # Vite genera la salida en dist/ (relativo a appRoot).
        baseDirectory: dist
        files:
          - "**/*"
      cache:
        paths:
          - node_modules/**/*
